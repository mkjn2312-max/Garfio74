
name: Compilar Garaje APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir Garaje
        run: |
          unzip -q Garaje.zip -d source
          test -f source/Garaje/app/build.gradle.kts

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Garaje
        working-directory: source/Garaje
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Garaje-APK
          path: source/Garaje/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
